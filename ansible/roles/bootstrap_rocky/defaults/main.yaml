---
timezone: Asia/Jakarta

rocky_common_packages:
  - mlocate
  - wget
  - epel-release
  - zip
  - unzip
  - vim
  - traceroute
  - telnet
  - net-tools
  - rsync
  - nginx
  - nginx-mod-stream
  - python3
  - python3-pip

docker_compose_dest: /usr/local/bin/docker-compose

security_auto_updates: true
security_upgrade_type: security
security_auto_reboot: "never"
security_baseline_upgrade: true

kernel_hardening: true
kernel_blacklist_modules:
  - cramfs
  - freevxfs
  - jffs2
  - hfs
  - hfsplus
  - udf
  - dccp
  - sctp
  - rds
  - tipc
